<!-- Junimo Jams (RustedUI Edition) - Minimal Retro Music Player HUD -->
<div class="w-full h-full flex flex-col justify-start items-start p-4">
    <div id="music_card" class="flex flex-row items-center w-320 h-80 sdv-box p-2 gap-2 overflow-hidden">
        <!-- Album Art / Vinyl Frame (Flush with card height) -->
        <div id="album_art_slot" class="w-16 h-16 shrink-0 flex items-center justify-center sdv-panel overflow-hidden">
            <icon name="sparkles" class="lucide-icon lucide-md" />
        </div>

        <!-- Track Info & Controls Column -->
        <div class="flex flex-col flex-1 h-full justify-between min-w-0">
            <!-- Row 1: Title (Prominent, Bold, Truncated cleanly) -->
            <div class="flex flex-row items-center w-full min-w-0">
                <span id="track_title" class="font-small text-sdv-brown shadow truncate w-full">Not Running</span>
            </div>

            <!-- Row 2: Artist & Timestamp -->
            <div class="flex flex-row items-center justify-between w-full min-w-0">
                <span id="track_artist" class="font-tiny text-sdv-dark truncate flex-1 mr-1">Music Player</span>
                <span id="hud_time" class="font-tiny text-sdv-muted shrink-0">0:00 / 0:00</span>
            </div>

            <!-- Row 3: Slim Progress Bar -->
            <div id="progress_row" class="w-full">
                <progress-bar id="hud_progress_bar" value="0" max="100" class="w-full h-1.5 sdv-bar" />
            </div>

            <!-- Row 4: Centered Media Controls (Prev, Play/Pause, Next) -->
            <div id="controls_row" class="flex flex-row items-center justify-center gap-6 w-full h-5">
                <div id="btn_prev" class="w-6 h-5 flex items-center justify-center" on:click="prev"></div>
                <div id="btn_playpause" class="w-6 h-5 flex items-center justify-center" on:click="playpause"></div>
                <div id="btn_next" class="w-6 h-5 flex items-center justify-center" on:click="next"></div>
            </div>
        </div>
    </div>
</div>
