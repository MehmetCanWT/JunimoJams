<!-- Junimo Jams (RustedUI Edition) - Music Hub Control Panel -->
<div class="w-full h-full flex flex-col justify-center items-center">
    <div id="music_hub_window" class="flex flex-col w-640 h-auto sdv-box gap-3">
        <!-- Header -->
        <div class="flex flex-row justify-between items-center w-full gap-2">
            <banner class="sdv-parchment flex-row items-center gap-2">
                <icon name="sparkles" class="lucide-icon lucide-md" />
                <span class="font-dialogue text-sdv-brown shadow">Junimo Jams Music Hub</span>
            </banner>
            <close-button id="btn_close" on:click="close_menu" />
        </div>

        <!-- Now Playing Card -->
        <panel class="flex flex-col gap-2 sdv-panel w-full">
            <div class="flex flex-row items-center justify-between w-full">
                <div class="flex flex-row items-center gap-2">
                    <icon name="zap" class="lucide-icon lucide-md" />
                    <span class="font-dialogue text-sdv-brown">Now Playing</span>
                </div>
                <div class="flex flex-row items-center gap-2">
                    <span id="menu_time" class="font-tiny text-sdv-muted">0:00 / 0:00</span>
                    <badge id="menu_status_badge" variant="primary" class="sdv-badge badge-primary">Playing</badge>
                </div>
            </div>
            <span id="menu_track_title" class="font-dialogue text-sdv-brown shadow">No Track Playing</span>
            <span id="menu_track_artist" class="font-small text-sdv-dark">Start Spotify, YouTube Music, BitChord, or desktop player</span>

            <!-- Track Timeline Progress Bar -->
            <div class="w-full py-1">
                <progress-bar id="menu_progress_bar" value="0" max="100" class="w-full h-4 sdv-bar" />
            </div>

            <!-- Controls Row -->
            <div class="flex flex-row items-center justify-center gap-4 w-full pt-2">
                <button id="btn_menu_prev" class="sdv-btn px-4" on:click="prev">|&lt; Prev</button>
                <button id="btn_menu_playpause" class="sdv-btn px-6" on:click="playpause">Play</button>
                <button id="btn_menu_next" class="sdv-btn px-4" on:click="next">Next &gt;|</button>
            </div>
        </panel>

        <hr class="sdv-divider" />

        <!-- Live Theme Switcher -->
        <panel class="flex flex-col gap-2 sdv-panel w-full">
            <div class="flex flex-row items-center justify-between w-full">
                <div class="flex flex-row items-center gap-2">
                    <icon name="palette" class="lucide-icon lucide-md" />
                    <span class="font-small text-sdv-dark">Theme Selector:</span>
                </div>
                <span id="menu_active_theme" class="font-small text-sdv-brown">Theme: Junimo Forest</span>
            </div>
            <div class="flex flex-row items-center justify-between w-full gap-2">
                <button id="btn_theme_junimo" class="sdv-btn flex-1" on:click="theme_junimo">Junimo</button>
                <button id="btn_theme_pelican" class="sdv-btn flex-1" on:click="theme_pelican">Pelican</button>
                <button id="btn_theme_zinc" class="sdv-btn flex-1" on:click="theme_zinc">Zinc Dark</button>
                <button id="btn_theme_arcane" class="sdv-btn flex-1" on:click="theme_arcane">Arcane</button>
                <button id="btn_theme_joja" class="sdv-btn flex-1" on:click="theme_joja">JojaCorp</button>
            </div>
            <div class="flex flex-row items-center justify-between w-full gap-2">
                <button id="btn_theme_catppuccin" class="sdv-btn flex-1" on:click="theme_catppuccin">Catppuccin</button>
                <button id="btn_theme_tokyonight" class="sdv-btn flex-1" on:click="theme_tokyonight">Tokyo Night</button>
                <button id="btn_theme_dracula" class="sdv-btn flex-1" on:click="theme_dracula">Dracula</button>
                <button id="btn_theme_nord" class="sdv-btn flex-1" on:click="theme_nord">Nord</button>
                <button id="btn_theme_cyberpunk" class="sdv-btn flex-1" on:click="theme_cyberpunk">Cyberpunk</button>
            </div>
        </panel>

        <!-- Footer -->
        <div class="flex flex-row items-center justify-between w-full px-2">
            <span class="font-tiny text-sdv-muted">Press [F6] or [ESC] to return to game</span>
            <button id="btn_menu_close_bottom" class="sdv-btn px-4" on:click="close_menu">Done</button>
        </div>
    </div>
</div>
