<!-- Junimo Jams (RustedUI Edition) - Zero-GC Music HUD Overlay -->
<div class="w-full h-full flex flex-col justify-start items-start p-4">
    <div id="music_card" class="flex flex-row items-center w-400 h-auto sdv-box p-3 gap-3" tooltip="Junimo Jams (RustedUI Edition)">
        <!-- Album Art / Vinyl Placeholder -->
        <div id="album_art_slot" class="w-20 h-20 shrink-0 flex items-center justify-center sdv-panel" tooltip="Album Cover Art">
            <icon name="sparkles" class="lucide-icon lucide-lg" />
        </div>

        <!-- Track Info & Controls -->
        <div class="flex flex-col flex-1 gap-1 min-w-0">
            <!-- Header: Status Badge & Music Hub shortcut -->
            <div class="flex flex-row items-center justify-between w-full">
                <badge id="hud_badge" variant="secondary" class="sdv-badge badge-secondary">Idle</badge>
                <div class="flex flex-row items-center gap-1 shrink-0" on:click="open_menu" tooltip="Open Music Hub [F6]">
                    <icon name="zap" class="lucide-icon lucide-sm" />
                    <span id="hud_source" class="font-tiny text-sdv-muted">Hub [F6]</span>
                </div>
            </div>

            <!-- Title & Artist -->
            <span id="track_title" class="font-dialogue text-sdv-brown shadow">Not Running</span>
            <span id="track_artist" class="font-small text-sdv-dark">Start Spotify or YouTube Music</span>

            <!-- Controls Row -->
            <div id="controls_row" class="flex flex-row items-center justify-between w-full pt-1">
                <arrow-left id="btn_prev" on:click="prev" tooltip="Previous Track" />
                <button id="btn_playpause" class="sdv-btn px-4" on:click="playpause" tooltip="Play / Pause">Play</button>
                <arrow-right id="btn_next" on:click="next" tooltip="Next Track" />
            </div>
        </div>
    </div>
</div>
