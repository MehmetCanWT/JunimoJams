<!-- Junimo Jams (RustedUI Edition) - Clean Minimal HUD Overlay -->
<div class="w-full h-full flex flex-col justify-start items-start p-4">
    <div id="music_card" class="flex flex-row items-center w-400 h-auto sdv-box gap-3">
        <!-- Album Art / Vinyl Frame -->
        <div id="album_art_slot" class="w-18 h-18 shrink-0 flex items-center justify-center sdv-panel overflow-hidden">
            <icon name="sparkles" class="lucide-icon lucide-md" />
        </div>

        <!-- Track Info & Controls -->
        <div class="flex flex-col flex-1 gap-1 min-w-0">
            <!-- Row 1: Title & Status -->
            <div class="flex flex-row items-center justify-between w-full">
                <span id="track_title" class="font-dialogue text-sdv-brown shadow truncate flex-1 mr-2">Not Running</span>
                <span id="hud_badge" class="font-tiny text-sdv-muted shrink-0">Idle</span>
            </div>

            <!-- Row 2: Artist & Time -->
            <div class="flex flex-row items-center justify-between w-full">
                <span id="track_artist" class="font-small text-sdv-dark truncate flex-1 mr-2">Music Player</span>
                <span id="hud_time" class="font-tiny text-sdv-muted shrink-0">0:00 / 0:00</span>
            </div>

            <!-- Row 3: Progress Bar -->
            <div id="progress_row" class="w-full py-1">
                <progress-bar id="hud_progress_bar" value="0" max="100" class="w-full h-2 sdv-bar" />
            </div>

            <!-- Row 4: Controls & Hub Shortcut -->
            <div id="controls_row" class="flex flex-row items-center justify-between w-full pt-1">
                <div class="flex flex-row items-center gap-2">
                    <arrow-left id="btn_prev" on:click="prev" />
                    <button id="btn_playpause" class="sdv-btn px-3" on:click="playpause">Play</button>
                    <arrow-right id="btn_next" on:click="next" />
                </div>
                <button id="btn_open_hub" class="sdv-btn px-2" on:click="open_menu">Hub [F6]</button>
            </div>
        </div>
    </div>
</div>
